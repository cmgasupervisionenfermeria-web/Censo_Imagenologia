<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A3D6B">
<title>Imagenología CMGA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1C2331;--azul2:#2E3A4E;--azul3:#ECEEF1;
  --cyan:#374151;--cyan2:#4B5563;--cyan3:#F3F4F6;
  --verde:#14532D;--verde2:#22C55E;--verde3:#DCFCE7;
  --naranja:#9A3412;--naranja2:#F97316;--naranja3:#FFEDD5;
  --morado:#6B21A8;--morado2:#9333EA;--morado3:#F3E8FF;
  --rojo:#7C0A02;--rojo2:#C0392B;--rojo3:#FDECEA;
  --amarillo:#856404;--amarillo2:#F59E0B;--amarillo3:#FEF9C3;
  --gris0:#F8FAFC;--gris1:#F1F5F9;--gris2:#E2E8F0;--gris3:#CBD5E1;
  --gris4:#94A3B8;--gris5:#64748B;--gris6:#334155;--gris7:#1E293B;
  --txt:#0F172A;--r:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:'DM Sans',sans-serif;background:var(--gris0);color:var(--txt);font-size:14px;min-height:100vh}
nav{background:var(--azul);padding:0 20px;display:flex;align-items:center;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25);gap:12px}
.logo{color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0}
.logo-icon{width:28px;height:28px;background:rgba(255,255,255,.2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav-tab{color:rgba(255,255,255,.65);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;border:none;background:none;white-space:nowrap;font-family:inherit;transition:all .15s}
.nav-tab:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-tab.active{background:rgba(255,255,255,.2);color:#fff}
.page{display:none;padding:20px;max-width:1400px;margin:0 auto}
.page.active{display:block}
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.date-nav{display:flex;align-items:center;gap:6px}
.date-nav button{background:#fff;border:1px solid var(--gris3);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:15px;font-family:inherit}
.date-nav button:hover{background:var(--gris1)}
.date-lbl{font-size:14px;font-weight:600;min-width:220px;text-align:center;color:var(--gris7)}
.card{background:#fff;border:1px solid var(--gris2);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card-header{padding:12px 16px;border-bottom:1px solid var(--gris2);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gris0);border-radius:var(--r) var(--r) 0 0}
.card-title{font-weight:600;font-size:13px;color:var(--gris7);display:flex;align-items:center;gap:7px}
.btn{padding:7px 14px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--azul);color:#fff}.btn-primary:hover{background:var(--azul2)}
.btn-success{background:var(--verde);color:#fff}
.btn-ghost{background:transparent;color:var(--gris5);border:1px solid var(--gris3)}.btn-ghost:hover{background:var(--gris1)}
.btn-danger{background:var(--rojo3);color:var(--rojo);border:1px solid #FECACA}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group.full{grid-column:1/-1}
label{font-size:10px;font-weight:600;color:var(--gris5);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{padding:7px 10px;border:1px solid var(--gris3);border-radius:7px;font-family:inherit;font-size:13px;color:var(--txt);background:#fff;outline:none;width:100%;transition:border .15s}
input:focus,select:focus{border-color:var(--azul2);box-shadow:0 0 0 3px rgba(46,58,78,.12)}
.section-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gris4);padding:12px 0 8px;border-bottom:1px solid var(--gris2);margin-bottom:10px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--gris2);flex-wrap:wrap}
/* Tipo estudio chips */
.tipo-rayosx{background:#E8EAF0;color:#1C2331;border:1.5px solid #9CA3AF;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
.tipo-us{background:#E1F5FE;color:#0277BD;border:1.5px solid #7DD3FC;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
.tipo-tac{background:var(--naranja3);color:var(--naranja);border:1.5px solid #FCA974;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
.tipo-masto{background:var(--morado3);color:var(--morado);border:1.5px solid #D8B4FE;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
.tipo-especial{background:var(--amarillo3);color:var(--amarillo);border:1.5px solid #FDE68A;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
/* Urgencia chips */
.urg-urgente{background:var(--rojo3);color:var(--rojo);border:1.5px solid #F5A49A;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
.urg-programado{background:var(--verde3);color:var(--verde);border:1.5px solid #86EFAC;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
/* Tipo selector buttons */
.tipo-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:4px}
.tipo-btn{padding:9px 6px;border-radius:8px;border:2px solid;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;text-align:center;transition:all .15s}
.tipo-btn.rxb{border-color:#9CA3AF;color:#1C2331;background:#E8EAF0}
.tipo-btn.usb{border-color:#7DD3FC;color:#0277BD;background:#E1F5FE}
.tipo-btn.tacb{border-color:#FCA974;color:var(--naranja);background:var(--naranja3)}
.tipo-btn.mastob{border-color:#D8B4FE;color:var(--morado);background:var(--morado3)}
.tipo-btn.espb{border-color:#FDE68A;color:var(--amarillo);background:var(--amarillo3)}
.tipo-btn.selected{opacity:1;transform:scale(1.04);box-shadow:0 0 0 3px currentColor}
.tipo-btn:not(.selected){opacity:.5}
/* Urgencia buttons */
.urg-btns{display:flex;gap:8px;margin-top:4px}
.urg-btn{flex:1;padding:8px;border-radius:8px;border:2px solid;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;text-align:center;transition:all .15s}
.urg-btn.urgente{border-color:var(--rojo2);color:var(--rojo);background:var(--rojo3)}
.urg-btn.programado{border-color:var(--verde2);color:var(--verde);background:var(--verde3)}
.urg-btn.selected{opacity:1;transform:scale(1.03);box-shadow:0 0 0 3px currentColor}
.urg-btn:not(.selected){opacity:.5}
/* Estado chips */
.estado-solicitado{background:#ECEEF1;color:#1C2331;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}
.estado-proceso{background:var(--amarillo3);color:var(--amarillo);padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}
.estado-realizado{background:var(--verde3);color:var(--verde);padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}
.estado-reportado{background:var(--morado3);color:var(--morado);padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}
/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--gris1);padding:7px 10px;text-align:left;font-weight:600;font-size:10px;color:var(--gris5);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--gris2);white-space:nowrap;position:sticky;top:0}
tbody tr{border-bottom:1px solid var(--gris1);transition:background .1s;cursor:pointer}
tbody tr:hover{background:var(--gris0)}
tbody td{padding:8px 10px;color:var(--gris6);vertical-align:middle}
.add-row-btn{width:100%;padding:10px;background:var(--gris0);border:none;border-top:1px solid var(--gris2);cursor:pointer;font-family:inherit;font-size:12px;color:var(--gris4);border-radius:0 0 8px 8px}
.add-row-btn:hover{background:var(--gris1)}
/* Stats */
.stats-grid{display:grid;gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border:1px solid var(--gris2);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat-lbl{font-size:10px;font-weight:600;color:var(--gris4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-val{font-size:26px;font-weight:600;line-height:1}
.stat-sub{font-size:10px;color:var(--gris4);margin-top:3px}
/* Indicadores */
.ind-card{background:#fff;border:1px solid var(--gris2);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.ind-hdr{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.ind-dot{width:8px;height:8px;border-radius:50%}
.ind-ttl{font-size:10px;font-weight:700;color:var(--gris5);text-transform:uppercase;letter-spacing:.05em}
.ind-formula{font-size:9px;color:var(--gris4);font-family:'DM Mono',monospace;margin-bottom:6px}
.ind-val{font-size:28px;font-weight:600;line-height:1;margin-bottom:3px}
.ind-desc{font-size:11px;color:var(--gris4);line-height:1.5}
.ind-bar{height:4px;background:var(--gris2);border-radius:99px;margin-top:8px;overflow:hidden}
.ind-fill{height:100%;border-radius:99px}
.ind-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ind-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.group-title{font-size:11px;font-weight:700;color:var(--gris6);text-transform:uppercase;letter-spacing:.06em;padding:10px 0 6px;border-bottom:2px solid var(--gris2);margin-bottom:10px;grid-column:1/-1}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:200}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:820px;max-height:92vh;overflow-y:auto}
@media(min-width:820px){.modal-bg{align-items:center;padding:1rem}.modal{border-radius:14px}}
.modal-handle{width:36px;height:4px;background:var(--gris3);border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;cursor:pointer;color:var(--gris4);font-size:22px;line-height:1}
/* PIN */
.pin-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500}
.pin-modal.open{display:flex}
/* Toast */
.toast{position:fixed;bottom:22px;right:22px;background:var(--gris7);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:translateY(70px);opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);z-index:999;max-width:300px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--verde)}
.toast.error{background:var(--rojo)}
.empty{text-align:center;padding:32px 20px;color:var(--gris4)}
.empty-icon{font-size:28px;margin-bottom:6px;opacity:.4}
@media(max-width:700px){
  .stats-grid{grid-template-columns:repeat(2,1fr)!important}
  .form-grid-3,.form-grid-4{grid-template-columns:1fr 1fr}
  .tipo-btns{grid-template-columns:repeat(3,1fr)}
  .ind-grid-2,.ind-grid-3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav>
  <div class="logo"><div class="logo-icon">🩻</div>Imagenología</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('registro',this)">📋 Registro Diario</button>
    <button class="nav-tab" onclick="showPage('concentrado',this)">📊 Concentrado</button>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px;padding-left:12px;flex-shrink:0">
    <span id="modeLabel" style="background:rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:500">Solo lectura 🔒</span>
    <button id="lockBtn" onclick="toggleLock()" style="background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit">PIN</button>
  </div>
</nav>

<!-- PIN Modal -->
<div class="pin-modal" id="pinModal">
  <div style="background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:320px;text-align:center">
    <div style="font-size:36px;margin-bottom:10px">🔐</div>
    <div style="font-size:17px;font-weight:600;margin-bottom:6px">Acceso de edición</div>
    <div style="font-size:13px;color:#94A3B8;margin-bottom:18px">Ingresa el PIN para registrar estudios</div>
    <input id="pinInput" type="password" maxlength="6" placeholder="······" onkeydown="if(event.key==='Enter')verifyPin()"
      style="width:100%;padding:12px;font-size:20px;text-align:center;border:2px solid #CBD5E1;border-radius:10px;font-family:'DM Mono',monospace;letter-spacing:.3em;margin-bottom:14px;outline:none">
    <div id="pinError" style="color:#991B1B;font-size:12px;margin-bottom:10px;min-height:16px"></div>
    <div style="display:flex;gap:8px">
      <button onclick="closePinModal()" style="flex:1;padding:9px;border-radius:8px;border:1px solid #CBD5E1;background:transparent;cursor:pointer;font-family:inherit">Cancelar</button>
      <button onclick="verifyPin()" style="flex:1;padding:9px;border-radius:8px;border:none;background:#1C2331;color:#fff;cursor:pointer;font-family:inherit;font-weight:500">Ingresar</button>
    </div>
  </div>
</div>

<!-- ===================== PÁGINA: REGISTRO DIARIO ===================== -->
<div class="page active" id="page-registro">
  <div class="top-bar">
    <div class="date-nav">
      <button onclick="cambiarDia(-1)">&#8249;</button>
      <span class="date-lbl" id="dateLabel"></span>
      <button onclick="cambiarDia(1)">&#8250;</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="requirePin(()=>abrirModal(null))">+ Registrar estudio</button>
    <button class="btn btn-ghost btn-sm" onclick="exportarCSV()">↓ CSV</button>
  </div>

  <div id="statsDay" class="stats-grid" style="grid-template-columns:repeat(6,1fr)"></div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">🩻 Estudios del día</span>
      <span id="reg-count" style="font-size:12px;color:var(--gris4)"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Fecha</th><th>H. Solicitud</th><th>H. Inicio</th><th>H. Fin</th><th>H. Reporte</th>
          <th>Tipo</th><th>Estudio</th><th>Prioridad</th><th>Servicio</th>
          <th>Paciente</th><th>Expediente</th><th>Edad</th><th>Sexo</th>
          <th>Técnico</th><th>Radiólogo</th><th>Estado</th><th>Observaciones</th><th></th>
        </tr></thead>
        <tbody id="reg-tbody"></tbody>
      </table>
      <div class="empty" id="reg-empty"><div class="empty-icon">🩻</div><p>Sin estudios registrados hoy</p></div>
      <button class="add-row-btn" onclick="requirePin(()=>abrirModal(null))">+ Registrar estudio</button>
    </div>
  </div>
</div>

<!-- ===================== PÁGINA: CONCENTRADO ===================== -->
<div class="page" id="page-concentrado">
  <div class="top-bar" style="justify-content:space-between">
    <div style="font-size:16px;font-weight:600;color:var(--gris7)">Concentrado Mensual</div>
    <div style="display:flex;gap:8px">
      <select id="con-mes" onchange="renderConcentrado()" style="padding:7px 10px;font-size:12px;border-radius:7px;border:1px solid var(--gris3)">
        <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
        <option value="3">Abril</option><option value="4">Mayo</option><option value="5" selected>Junio</option>
        <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
        <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
      </select>
      <select id="con-anio" onchange="renderConcentrado()" style="padding:7px 10px;font-size:12px;border-radius:7px;border:1px solid var(--gris3)">
        <option>2025</option><option selected>2026</option><option>2027</option>
      </select>
    </div>
  </div>
  <div id="concentrado-body"></div>
</div>

<!-- ===================== MODAL ESTUDIO ===================== -->
<div class="modal-bg" id="modalEstudio" onclick="if(event.target===this)closeModal('modalEstudio')">
  <div class="modal"><div class="modal-handle"></div><div id="modalEstudioContent"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIGURACIÓN ─────────────────────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx2oWmOzxUBT37TrODXrAw1EekRVFkMK5L4TmHdqxnf7uFQcSeVv4YJmr-SOzBh2wqS/exec';
const PIN = 'IMG1'; // Cambia este PIN
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const TIPOS_ESTUDIO = {
  'Rayos X':    { clase:'tipo-rayosx', btnClase:'rxb',   icon:'🦴', color:'#1C2331' },
  'Ultrasonido':{ clase:'tipo-us',     btnClase:'usb',   icon:'〰️', color:'#0E7490' },
  'TAC':        { clase:'tipo-tac',    btnClase:'tacb',  icon:'🌀', color:'#9A3412' },
  'Mastografía':{ clase:'tipo-masto',  btnClase:'mastob',icon:'🔬', color:'#6B21A8' },
  'Especial':   { clase:'tipo-especial',btnClase:'espb', icon:'⚗️', color:'#856404' },
};

const ESTUDIOS_ESPECIALES = [
  'Histerosalpingografía','Biopsia guiada por US','Biopsia guiada por TAC',
  'Articulografía','Urografía','Colangiografía','Otro especial'
];

const SERVICIOS = [
  'Urgencias','Hospitalización','Consulta Externa','Quirófano','UCI/UCIN',
  'Pediatría','Ginecología','Cirugía','Medicina Interna','Traumatología',
  'Oncología','Externo / Referencia'
];

const ESTADOS = ['Solicitado','En proceso','Realizado','Reportado'];

const GAS_OK = GAS_URL.indexOf('TU_URL') === -1;

// ── ESTADO ────────────────────────────────────────────────────────────────
let cur = new Date(); cur.setHours(0,0,0,0);
let pinOK = false, pinCB = null, nid = 1;
let DB = { estudios: [] };

// ── UTILERÍAS ─────────────────────────────────────────────────────────────
function dk(d){ if(typeof d==='string') d=new Date(d+'T12:00:00'); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(d){ const days=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado']; const m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; return days[d.getDay()]+', '+d.getDate()+' de '+m[d.getMonth()]+' de '+d.getFullYear(); }
function toast(msg,tipo){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(tipo||'success'); setTimeout(()=>t.className='toast',3000); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function showLoader(m){ let el=document.getElementById('lb'); if(!el){el=document.createElement('div');el.id='lb';el.style.cssText='position:fixed;top:54px;left:0;right:0;background:#1C2331;color:#fff;text-align:center;padding:6px;font-size:12px;z-index:300';document.body.appendChild(el);} el.textContent=m; el.style.display='block'; }
function hideLoader(){ const el=document.getElementById('lb'); if(el) el.style.display='none'; }
function minEntre(h1,h2){ if(!h1||!h2) return null; const p1=h1.split(':').map(Number),p2=h2.split(':').map(Number); const diff=(p2[0]*60+p2[1])-(p1[0]*60+p1[1]); return diff>=0?diff:diff+1440; }
function fmtMin(m){ if(m===null||m===undefined) return '-'; const h=Math.floor(m/60),min=m%60; return h>0?(h+'h '+min+'m'):(min+'m'); }
function calcEdad(fnac){ if(!fnac) return ''; const n=new Date(fnac+'T12:00'),h=new Date(); let e=h.getFullYear()-n.getFullYear(); if(h.getMonth()-n.getMonth()<0||(h.getMonth()-n.getMonth()===0&&h.getDate()<n.getDate())) e--; return e>=0?e:''; }

function tipoChip(tipo){
  if(!tipo) return '-';
  const t=TIPOS_ESTUDIO[tipo];
  if(!t) return '<span style="font-size:11px">'+tipo+'</span>';
  return '<span class="'+t.clase+'">'+t.icon+' '+tipo+'</span>';
}
function urgChip(u){
  if(!u) return '-';
  return u==='Urgente'?'<span class="urg-urgente">🔴 Urgente</span>':'<span class="urg-programado">🟢 Programado</span>';
}
function estadoChip(e){
  if(!e) return '-';
  const m={'Solicitado':'estado-solicitado','En proceso':'estado-proceso','Realizado':'estado-realizado','Reportado':'estado-reportado'};
  return '<span class="'+(m[e]||'')+'">'+e+'</span>';
}

// ── PERSISTENCIA ──────────────────────────────────────────────────────────
function guardarLocal(){ try{ localStorage.setItem('img_v1',JSON.stringify({db:DB,nid:nid})); }catch(e){} }
function cargarLocal(){ try{ const r=localStorage.getItem('img_v1'); if(!r) return false; const p=JSON.parse(r); if(p.db&&Array.isArray(p.db.estudios)) DB.estudios=p.db.estudios; if(p.nid) nid=p.nid; return true; }catch(e){ return false; } }
function recalcNid(){ const ids=DB.estudios.map(x=>Number(x.id)||0); nid=ids.length?Math.max(...ids)+1:1; }

async function apiCall(payload){
  guardarLocal();
  if(!GAS_OK) return {ok:true};
  try{
    const params=new URLSearchParams();
    params.append('action',payload.action);
    params.append('section',payload.section||'');
    if(payload.record) params.append('record',JSON.stringify(payload.record));
    if(payload.id!==undefined) params.append('id',payload.id);
    const r=await fetch(GAS_URL+'?'+params.toString());
    const data=await r.json();
    if(data.ok) guardarLocal();
    return data;
  }catch(e){ toast('Sin conexión — guardado local','error'); return{ok:false}; }
}

async function cargarDatos(){
  const hayLocal=cargarLocal();
  if(hayLocal){ recalcNid(); actualizarFechas(); renderRegistro(); }
  if(!GAS_OK){ if(!hayLocal){actualizarFechas();renderRegistro();} return; }
  showLoader('Sincronizando con Google Sheets...');
  try{
    const r=await fetch(GAS_URL+'?action=getAll');
    const data=await r.json();
    if(data&&typeof data==='object'){
      if(Array.isArray(data.estudios)){
        DB.estudios=data.estudios.map(rec=>{
          ['fecha','fechaNac'].forEach(c=>{ if(rec[c]&&String(rec[c]).includes('T')) rec[c]=String(rec[c]).split('T')[0]; });
          ['horaSolicitud','horaInicio','horaFin','horaReporte'].forEach(c=>{
            if(rec[c]&&String(rec[c]).includes('T')){
              const d=new Date(rec[c]);
              rec[c]=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
            }
          });
          return rec;
        });
      }
      recalcNid(); guardarLocal();
    }
  }catch(e){ console.error(e); }
  hideLoader(); actualizarFechas(); renderRegistro();
}

async function guardarEstudio(id){
  const tipo=document.getElementById('f-tipo').value;
  const esEsp=tipo==='Especial';
  const estudio=esEsp
    ?document.getElementById('f-estudio-esp').value
    :(document.getElementById('f-estudio-libre')?.value||'');
  const hsol=document.getElementById('f-hsol').value;
  const hinicio=document.getElementById('f-hinicio').value;
  const hfin=document.getElementById('f-hfin').value;
  const hrep=document.getElementById('f-hrep').value;

  const d={
    id:id||nid++,
    num:(function(){ const f=document.getElementById('f-fecha').value; const n=DB.estudios.filter(r=>r.fecha===f).length+(id?0:1); return id?(DB.estudios.find(r=>r.id===id)||{}).num||n:n; }()),
    fecha:document.getElementById('f-fecha').value,
    horaSolicitud:hsol,
    horaInicio:hinicio,
    horaFin:hfin,
    horaReporte:hrep,
    minEsperaInicio:minEntre(hsol,hinicio),
    minEjecucion:minEntre(hinicio,hfin),
    minEntregaReporte:minEntre(hfin,hrep),
    tipo:tipo,
    estudio:estudio,
    prioridad:document.getElementById('f-prioridad').value,
    estado:document.getElementById('f-estado').value,
    servicio:document.getElementById('f-servicio').value,
    paciente:document.getElementById('f-pac').value.trim(),
    expediente:document.getElementById('f-exp').value.trim().toUpperCase(),
    fechaNac:document.getElementById('f-fnac').value,
    edad:document.getElementById('f-edad').value,
    sexo:document.getElementById('f-sexo').value,
    tecnico:document.getElementById('f-tecnico').value.trim(),
    radiologo:document.getElementById('f-radiologo').value.trim(),
    medicoSolicitante:document.getElementById('f-solicitante').value.trim(),
    observaciones:document.getElementById('f-obs').value.trim(),
  };

  if(id){ const i=DB.estudios.findIndex(r=>r.id===id); if(i>-1) DB.estudios[i]=d; }
  else DB.estudios.push(d);
  showLoader('Guardando...');
  await apiCall({action:id?'update':'save',section:'estudios',record:d});
  hideLoader(); closeModal('modalEstudio'); renderRegistro();
  toast('Estudio guardado ✓');
}

async function eliminar(id){
  if(!confirm('¿Eliminar este registro?')) return;
  DB.estudios=DB.estudios.filter(r=>r.id!==id);
  showLoader('Eliminando...');
  await apiCall({action:'delete',section:'estudios',id:id});
  hideLoader(); renderRegistro(); closeModal('modalEstudio');
  toast('Registro eliminado','error');
}

function exportarCSV(){
  const hoy=dk(cur);
  const data=DB.estudios.filter(r=>r.fecha===hoy);
  if(!data.length){toast('Sin datos para exportar','error');return;}
  const keys=Object.keys(data[0]);
  const csv=[keys.join(',')].concat(data.map(r=>keys.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"').join(','))).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='imagenologia_'+hoy+'.csv'; a.click(); toast('CSV exportado');
}

// ── CONCENTRADO MENSUAL ───────────────────────────────────────────────────
function renderConcentrado(){
  const mes=parseInt(document.getElementById('con-mes').value);
  const anio=parseInt(document.getElementById('con-anio').value);

  const est=DB.estudios.filter(function(r){
    const fd=r.fecha; if(!fd) return false;
    const d=new Date(fd+'T12:00');
    return d.getFullYear()===anio&&d.getMonth()===mes;
  });

  const diasConAct=[...new Set(est.map(r=>r.fecha).filter(Boolean))].length||1;
  const total=est.length;

  // Por tipo
  const porTipo={};
  Object.keys(TIPOS_ESTUDIO).forEach(t=>{ porTipo[t]=est.filter(r=>r.tipo===t).length; });

  // Tiempos
  const tEspera=est.map(r=>r.minEsperaInicio).filter(v=>v!==null&&v!==undefined&&v>=0);
  const tEjecucion=est.map(r=>r.minEjecucion).filter(v=>v!==null&&v!==undefined&&v>0);
  const tReporte=est.map(r=>r.minEntregaReporte).filter(v=>v!==null&&v!==undefined&&v>0);
  const pEspera=tEspera.length?Math.round(tEspera.reduce((a,b)=>a+b,0)/tEspera.length):null;
  const pEjecucion=tEjecucion.length?Math.round(tEjecucion.reduce((a,b)=>a+b,0)/tEjecucion.length):null;
  const pReporte=tReporte.length?Math.round(tReporte.reduce((a,b)=>a+b,0)/tReporte.length):null;

  // Prioridad
  const urgentes=est.filter(r=>r.prioridad==='Urgente').length;
  const programados=est.filter(r=>r.prioridad==='Programado').length;

  // Estado
  const estSol=est.filter(r=>r.estado==='Solicitado').length;
  const estProc=est.filter(r=>r.estado==='En proceso').length;
  const estReal=est.filter(r=>r.estado==='Realizado').length;
  const estRep=est.filter(r=>r.estado==='Reportado').length;
  const pctReportados=total?Math.round(estRep/total*1000)/10:0;
  const pctRealizados=total?Math.round((estReal+estRep)/total*1000)/10:0;

  // Por servicio (top 5)
  const porServicio={};
  est.forEach(r=>{ if(r.servicio) porServicio[r.servicio]=(porServicio[r.servicio]||0)+1; });
  const topServicios=Object.entries(porServicio).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // Por técnico
  const porTecnico={};
  est.forEach(r=>{ if(r.tecnico) porTecnico[r.tecnico]=(porTecnico[r.tecnico]||0)+1; });
  const topTecnicos=Object.entries(porTecnico).sort((a,b)=>b[1]-a[1]).slice(0,6);

  function ic(color,titulo,formula,valor,desc,barPct){
    return '<div class="ind-card">'+
      '<div class="ind-hdr"><div class="ind-dot" style="background:'+color+'"></div><span class="ind-ttl">'+titulo+'</span></div>'+
      (formula?'<div class="ind-formula">'+formula+'</div>':'')+
      '<div class="ind-val" style="color:'+color+'">'+valor+'</div>'+
      '<div class="ind-desc">'+desc+'</div>'+
      '<div class="ind-bar"><div class="ind-fill" style="width:'+Math.min(barPct||0,100)+'%;background:'+color+'"></div></div>'+
      '</div>';
  }

  const tipoColors={'Rayos X':'#1C2331','Ultrasonido':'#0277BD','TAC':'#9A3412','Mastografía':'#6B21A8','Especial':'#856404'};

  document.getElementById('concentrado-body').innerHTML=
    '<div style="font-size:16px;font-weight:600;color:var(--gris7);margin-bottom:14px">'+
    MESES[mes]+' '+anio+' &nbsp;|&nbsp; <span style="font-size:12px;font-weight:400;color:var(--gris4)">'+diasConAct+' días con actividad</span></div>'+

    // KPIs principales
    '<div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">'+
    '<div class="stat-card"><div class="stat-lbl">Total estudios</div><div class="stat-val" style="color:#1C2331">'+total+'</div><div class="stat-sub">Prom. diario: '+Math.round(total/diasConAct*10)/10+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">Urgentes</div><div class="stat-val" style="color:var(--rojo)">'+urgentes+'</div><div class="stat-sub">'+(total?Math.round(urgentes/total*100):0)+'% del total</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">Reportados</div><div class="stat-val" style="color:var(--morado)">'+estRep+'</div><div class="stat-sub">'+pctReportados+'% del total</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">% Productividad</div><div class="stat-val" style="color:var(--verde)">'+pctRealizados+'%</div><div class="stat-sub">Realizados + Reportados</div></div>'+
    '</div>'+

    // Tiempos
    '<div class="ind-grid-3" style="margin-bottom:12px">'+
    '<div class="group-title">Tiempos de Atención (promedios del mes)</div>'+
    ic('#1C2331','Espera para inicio','solicitud → inicio estudio',fmtMin(pEspera),'Promedio sobre '+tEspera.length+' registros. Meta urgentes: <30 min',pEspera!==null?Math.min(pEspera/60*100,100):0)+
    ic('#0E7490','Duración del estudio','inicio → fin del estudio',fmtMin(pEjecucion),'Promedio sobre '+tEjecucion.length+' registros',pEjecucion!==null?Math.min(pEjecucion/60*100,100):0)+
    ic('var(--morado)','Tiempo al reporte','fin estudio → entrega reporte',fmtMin(pReporte),'Promedio sobre '+tReporte.length+' registros',pReporte!==null?Math.min(pReporte/120*100,100):0)+
    '</div>'+

    // Por tipo
    '<div class="ind-grid-3" style="margin-bottom:12px">'+
    '<div class="group-title">Estudios por Modalidad</div>'+
    '<div class="ind-card" style="grid-column:1/-1">'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
    Object.entries(TIPOS_ESTUDIO).map(([nombre,t])=>{
      const n=porTipo[nombre]||0;
      return '<div style="flex:1;min-width:100px;text-align:center">'+
        '<div style="font-size:22px;margin-bottom:4px">'+t.icon+'</div>'+
        '<div style="font-size:10px;color:'+t.color+';font-weight:700;margin-bottom:2px">'+nombre+'</div>'+
        '<div style="font-size:24px;font-weight:700;color:'+t.color+'">'+n+'</div>'+
        '<div style="font-size:9px;color:var(--gris4)">'+(total?Math.round(n/total*100):0)+'%</div>'+
        '<div style="height:3px;background:var(--gris2);border-radius:99px;margin-top:6px;overflow:hidden">'+
        '<div style="height:100%;width:'+(total?Math.round(n/total*100):0)+'%;background:'+t.color+';border-radius:99px"></div></div>'+
        '</div>';
    }).join('')+
    '</div></div>'+
    '</div>'+

    // Estado y prioridad
    '<div class="ind-grid-2" style="margin-bottom:12px">'+
    '<div class="group-title">Estado y Prioridad</div>'+
    '<div class="ind-card">'+
    '<div class="ind-hdr"><div class="ind-dot" style="background:#1C2331"></div><span class="ind-ttl">Estado de estudios del mes</span></div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">'+
    [['Solicitado',estSol,'#1C2331','#ECEEF1'],['En proceso',estProc,'var(--amarillo)','var(--amarillo3)'],['Realizado',estReal,'var(--verde)','var(--verde3)'],['Reportado',estRep,'var(--morado)','var(--morado3)']].map(x=>
      '<div style="flex:1;min-width:70px;background:'+x[3]+';border-radius:8px;padding:8px;text-align:center">'+
      '<div style="font-size:9px;color:'+x[2]+';font-weight:700;margin-bottom:2px">'+x[0]+'</div>'+
      '<div style="font-size:20px;font-weight:700;color:'+x[2]+'">'+x[1]+'</div>'+
      '<div style="font-size:9px;color:'+x[2]+'">'+(total?Math.round(x[1]/total*100):0)+'%</div>'+
      '</div>'
    ).join('')+
    '</div></div>'+
    '<div class="ind-card">'+
    '<div class="ind-hdr"><div class="ind-dot" style="background:var(--rojo)"></div><span class="ind-ttl">Prioridad</span></div>'+
    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">'+
    [['🔴 Urgentes',urgentes,'var(--rojo)'],['🟢 Programados',programados,'var(--verde)'],['Total',total,'var(--gris6)']].map(x=>
      '<div style="flex:1;text-align:center">'+
      '<div style="font-size:10px;color:'+x[2]+';font-weight:700;margin-bottom:2px">'+x[0]+'</div>'+
      '<div style="font-size:24px;font-weight:700;color:'+x[2]+'">'+x[1]+'</div>'+
      '</div>'
    ).join('')+
    '</div></div>'+
    '</div>'+

    // Servicios solicitantes
    '<div class="ind-grid-2" style="margin-bottom:12px">'+
    '<div class="group-title">Demanda por Servicio y Productividad del Personal</div>'+
    '<div class="ind-card">'+
    '<div class="ind-hdr"><div class="ind-dot" style="background:#0E7490"></div><span class="ind-ttl">Top servicios solicitantes</span></div>'+
    (topServicios.length?
      '<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">'+
      topServicios.map(([s,n])=>
        '<div style="display:flex;align-items:center;gap:8px">'+
        '<div style="font-size:12px;font-weight:500;min-width:120px;color:var(--gris6)">'+s+'</div>'+
        '<div style="flex:1;height:6px;background:var(--gris2);border-radius:99px;overflow:hidden">'+
        '<div style="height:100%;width:'+(topServicios[0][1]?Math.round(n/topServicios[0][1]*100):0)+'%;background:#0E7490;border-radius:99px"></div></div>'+
        '<div style="font-size:12px;font-weight:700;color:#0E7490;min-width:24px;text-align:right">'+n+'</div>'+
        '</div>'
      ).join('')+
      '</div>':'<div style="color:var(--gris4);font-size:12px;margin-top:8px">Sin datos</div>')+
    '</div>'+
    '<div class="ind-card">'+
    '<div class="ind-hdr"><div class="ind-dot" style="background:var(--naranja2)"></div><span class="ind-ttl">Estudios por técnico</span></div>'+
    (topTecnicos.length?
      '<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">'+
      topTecnicos.map(([t,n])=>
        '<div style="display:flex;align-items:center;gap:8px">'+
        '<div style="font-size:12px;font-weight:500;min-width:120px;color:var(--gris6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t+'</div>'+
        '<div style="flex:1;height:6px;background:var(--gris2);border-radius:99px;overflow:hidden">'+
        '<div style="height:100%;width:'+(topTecnicos[0][1]?Math.round(n/topTecnicos[0][1]*100):0)+'%;background:var(--naranja2);border-radius:99px"></div></div>'+
        '<div style="font-size:12px;font-weight:700;color:var(--naranja2);min-width:24px;text-align:right">'+n+'</div>'+
        '</div>'
      ).join('')+
      '</div>':'<div style="color:var(--gris4);font-size:12px;margin-top:8px">Sin datos de técnico</div>')+
    '</div>'+
    '</div>';
}

// ── INIT ──────────────────────────────────────────────────────────────────
actualizarFechas();
cargarDatos();
</script>
</body>
</html>
